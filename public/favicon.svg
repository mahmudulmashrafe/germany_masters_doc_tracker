<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="64" height="64" rx="14" ry="14" />
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base with German Tricolor Stripes -->
  <g clip-path="url(#squircle)">
    <!-- Top Stripe: Dark Black -->
    <rect x="0" y="0" width="64" height="21.33" fill="#18181B" />
    <!-- Middle Stripe: German Crimson Red -->
    <rect x="0" y="21.33" width="64" height="21.33" fill="#DC2626" />
    <!-- Bottom Stripe: German Gold -->
    <rect x="0" y="42.66" width="64" height="21.34" fill="#F59E0B" />

    <!-- Center Document Sheet -->
    <g filter="url(#shadow)">
      <!-- Sheet Body -->
      <path d="M18 10 H38 L48 20 V52 C48 53.66 46.66 55 45 55 H18 C16.34 55 15 53.66 15 52 V13 C15 11.34 16.34 10 18 10 Z" fill="#FFFFFF" />
      
      <!-- Folded Corner -->
      <path d="M38 10 V18 C38 19.1 38.9 20 40 20 H48 Z" fill="#E2E8F0" />
      <path d="M38 10 L48 20" stroke="#CBD5E1" stroke-width="0.8" />

      <!-- Document Content Lines -->
      <rect x="20" y="23" width="14" height="3" rx="1.5" fill="#DC2626" />
      <rect x="20" y="29" width="22" height="2.5" rx="1.2" fill="#64748B" />
      <rect x="20" y="34.5" width="22" height="2.5" rx="1.2" fill="#94A3B8" />
      <rect x="20" y="40" width="14" height="2.5" rx="1.2" fill="#94A3B8" />

      <!-- Status Checkmark Badge -->
      <circle cx="41" cy="45" r="7" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M38 45 L40.2 47.2 L44.5 42.8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
